name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear la carpeta android (si no existe)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.abcmagico --project-name abc_magico .
          fi
          python3 tool/patch_android.py

      - name: Descargar paquetes
        run: flutter pub get

      - name: Ícono de la app
        run: dart run flutter_launcher_icons

      - name: Revisar el código (informativo)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar el APK
        uses: actions/upload-artifact@v5
        with:
          name: ABC-Magico-APK
          path: build/app/outputs/flutter-apk/app-release.apk
